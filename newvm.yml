---
- name: Create a Virtual Machine from XML
  hosts: localhost
  become: true
  tasks:
    - name: Define the VM using XML
      virt:
        name: my_vm
        command: define
        xml: |
          <domain type='kvm'>
            <name>my_vm</name>
            <memory unit='KiB'>2097152</memory> <!-- 2GB RAM -->
            <vcpu placement='static'>2</vcpu>
            <os>
              <type arch='x86_64' machine='pc'>hvm</type>
              <boot dev='hd'/>
            </os>
            <devices>
              <disk type='file' device='disk'>
                <driver name='qemu' type='qcow2'/>
                <source file='/var/lib/libvirt/images/my_vm.qcow2'/>
                <target dev='vda' bus='virtio'/>
              </disk>
              <interface type='network'>
                <source network='default'/>
                <model type='virtio'/>
              </interface>
              <graphics type='vnc' listen='0.0.0.0' port='5901'/>
            </devices>
          </domain>

    - name: Start the VM
      virt:
        name: my_vm
        state: running
